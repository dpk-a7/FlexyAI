server {
    listen 80;
    server_name _;
    server_tokens off;

    # Only the media endpoint needs a large request body. Keep login and other
    # control-plane requests small to avoid unauthenticated body-buffer abuse.
    client_max_body_size 1m;

    # Do not retain request paths, signed URLs, or prompt-bearing query strings
    # in Nginx access logs. Error logs remain available through the container.
    access_log off;
    error_log /dev/stderr warn;

    # Stream uploads to FastAPI instead of buffering full media files in Nginx.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Artifact files must be served only by an authorized FastAPI endpoint.
    location = /artifacts {
        return 404;
    }

    location ^~ /artifacts/ {
        return 404;
    }

    # Match MAX_UPLOAD_BYTES' documented 1 GiB default. FastAPI also checks the
    # required Content-Length before multipart parsing.
    location = /v1/api/inference {
        client_max_body_size 1g;
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
